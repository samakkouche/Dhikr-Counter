<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dhikr">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#000000">
<title>Dhikr Counter</title>
<style>
:root{--bg:#f6f3ec;--fg:#1d2b26;--muted:#6b7a73;--card:#ffffff;--accent:#1f7a5c;--line:#dcd7ca;--danger:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a16;--fg:#e8efe9;--muted:#8fa399;--card:#172520;--accent:#3fbf94;--line:#26372f;--danger:#e0705e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a16;--fg:#e8efe9;--muted:#8fa399;--card:#172520;--accent:#3fbf94;--line:#26372f;--danger:#e0705e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}
#main{flex:1;display:flex;flex-direction:column;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.bar .grp{display:flex;gap:8px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{color:var(--danger)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;gap:10px}
#name{font-size:clamp(22px,7vw,34px);font-weight:600}
#count{font-size:clamp(96px,32vw,180px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
#sub{color:var(--muted);font-size:18px}
#left.warn{color:var(--danger);font-weight:600}
.prog{width:min(80%,360px);height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
#fill{height:100%;width:0;background:var(--accent);transition:width .1s}
#step{color:var(--muted);font-size:14px;padding:0 0 18px;text-align:center}
#settings{flex:1;overflow-y:auto;padding:0 16px 24px}
#settings h2{margin:8px 0 4px}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.row{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.row input{min-width:0}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
input.n{flex:1}
input.t{width:76px;text-align:center}
.row button{padding:8px 10px}
.add{display:flex;gap:6px;margin:14px 0}
.add input.n{flex:1}
:root:root:root{--bg:#000;--fg:#b5b5b5;--muted:#6a6a6a;--card:#111;--accent:#8c8c8c;--line:#262626;--danger:#c0605a;color-scheme:dark}
button.primary{color:#000}
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div class="bar">
      <button id="bSet">⚙ Settings</button>
      <div class="grp"><button id="bUndo">Undo</button><button id="bReset">Reset</button></div>
    </div>
    <div class="center">
      <div id="name"></div>
      <div id="count">0</div>
      <div id="sub"><span id="of"></span> · <span id="left"></span></div>
      <div class="prog"><div id="fill"></div></div>
    </div>
    <div id="step"></div>
  </div>

  <div id="settings" class="hidden">
    <div class="bar" style="padding-left:0;padding-right:0">
      <h2 style="margin:0">Settings</h2>
      <button class="primary" id="bDone">Done</button>
    </div>
    <h3 style="margin:16px 0 8px">Haptics</h3>
    <div class="row"><label style="flex:1"><input type="checkbox" id="hTick"> Tick on every tap</label></div>
    <div class="row"><span style="flex:1">Alert when this many are left (0 = off)</span><input class="t" id="hAt" type="number" inputmode="numeric" min="0"></div>
    <div class="row"><span style="flex:1">Alert strength (number of buzzes)</span><input class="t" id="hN" type="number" inputmode="numeric" min="1" max="6"></div>
    <div class="row"><label style="flex:1"><input type="checkbox" id="hFin"> Buzz when each dhikr finishes</label><button id="hTest">Test alert</button></div>
    <h3 style="margin:16px 0 8px">Dhikr</h3>
    <p class="hint">Dhikr run in this order. Edit names and targets, reorder or remove them.</p>
    <div id="list"></div>
    <div class="add">
      <input class="n" id="newName" placeholder="New word or phrase">
      <input class="t" id="newTarget" type="number" inputmode="numeric" min="1" placeholder="33">
      <button class="primary" id="bAdd">Add</button>
    </div>
    <button id="bDefaults" class="danger">Restore defaults</button>
  </div>
</div>

<label id="hapL" style="position:fixed;left:0;top:0;opacity:0.01;z-index:-1"><input type="checkbox" switch tabindex="-1"></label>
<script>
var KEY='dhikr-counter-v1';
var DEF=[{name:'Astaghfirullah',target:1000},{name:'SubhanAllah',target:100},{name:'Alhamdulillah',target:100},{name:'Allahu Akbar',target:100}];
function defaults(){return {items:DEF.map(function(x){return {name:x.name,target:x.target}}),idx:0,count:0};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&Array.isArray(s.items)&&s.items.length)return s;}}catch(e){}return defaults();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function buzz(p){try{if(navigator.vibrate){navigator.vibrate(p);return;}}catch(e){}iosTick(p);}
function iosTick(p){var a=[].concat(p),t=0;for(var i=0;i<a.length;i++){if(i%2===0){if(t===0)hap();else setTimeout(hap,t);}t+=a[i];}}
function hap(){try{document.getElementById('hapL').click();}catch(e){}}
var S=load();
function hapDef(){return {tick:true,alertAt:10,alertTicks:3,finish:true};}
S.hap=Object.assign(hapDef(),S.hap||{});
var $=function(id){return document.getElementById(id)};

function fix(){
  if(S.idx>S.items.length)S.idx=S.items.length;
  if(S.idx<S.items.length&&S.count>=S.items[S.idx].target)S.count=Math.max(0,S.items[S.idx].target-1);
}

function render(){
  var done=S.idx>=S.items.length;
  $('bUndo').disabled=(S.idx===0&&S.count===0);
  if(done){
    $('name').textContent='Complete ✓';
    $('count').textContent='🤲';
    $('of').textContent='All dhikr finished';
    $('left').textContent='';$('left').className='';
    $('fill').style.width='100%';
    $('step').textContent='';
    return;
  }
  var c=S.items[S.idx],rem=c.target-S.count;
  $('name').textContent=c.name;
  $('count').textContent=S.count;
  $('of').textContent='of '+c.target;
  $('left').textContent=rem+' left';
  $('left').className=rem<=10?'warn':'';
  $('fill').style.width=(S.count/c.target*100)+'%';
  $('step').textContent=(S.idx+1)+' / '+S.items.length;
}

function tap(){
  if(S.idx>=S.items.length)return;
  var c=S.items[S.idx];
  S.count++;
  var rem=c.target-S.count;
  if(rem<=0){if(S.hap.finish)buzz([250,100,250]);S.idx++;S.count=0;}
  else if(S.hap.alertAt>0&&rem===S.hap.alertAt&&c.target>S.hap.alertAt){buzz(pat(S.hap.alertTicks));}
  else if(S.hap.tick){buzz(15);}
  save();render();
}

function undo(){
  if(S.count>0)S.count--;
  else if(S.idx>0){S.idx--;S.count=Math.max(0,S.items[S.idx].target-1);}
  save();render();
}

var resetArmed=false,resetTimer=null;
function reset(){
  if(!resetArmed){
    resetArmed=true;$('bReset').textContent='Tap again';$('bReset').classList.add('danger');
    resetTimer=setTimeout(disarm,3000);return;
  }
  disarm();S.idx=0;S.count=0;save();render();
}
function disarm(){resetArmed=false;clearTimeout(resetTimer);$('bReset').textContent='Reset';$('bReset').classList.remove('danger');}

function renderList(){
  var L=$('list');L.innerHTML='';
  S.items.forEach(function(it,i){
    var r=document.createElement('div');r.className='row';
    var n=document.createElement('input');n.className='n';n.value=it.name;
    n.onchange=function(){it.name=n.value.trim()||it.name;n.value=it.name;save();};
    var t=document.createElement('input');t.className='t';t.type='number';t.inputMode='numeric';t.min=1;t.value=it.target;
    t.onchange=function(){var v=parseInt(t.value,10);if(!(v>0))v=it.target;it.target=v;t.value=v;fix();save();};
    var up=btn('↑',function(){mv(i,-1)});up.disabled=i===0;
    var dn=btn('↓',function(){mv(i,1)});dn.disabled=i===S.items.length-1;
    var del=btn('✕',function(){rm(i)});del.className='danger';del.disabled=S.items.length<=1;
    [n,t,up,dn,del].forEach(function(e){r.appendChild(e)});
    L.appendChild(r);
  });
}
function btn(txt,fn){var b=document.createElement('button');b.textContent=txt;b.onclick=fn;return b;}
function mv(i,d){
  var j=i+d;if(j<0||j>=S.items.length)return;
  var cur=S.idx<S.items.length?S.items[S.idx]:null;
  var tmp=S.items[i];S.items[i]=S.items[j];S.items[j]=tmp;
  if(cur)S.idx=S.items.indexOf(cur);
  save();renderList();
}
function rm(i){
  if(S.items.length<=1)return;
  var wasCurrent=(i===S.idx);
  S.items.splice(i,1);
  if(i<S.idx)S.idx--;
  else if(wasCurrent)S.count=0;
  fix();save();renderList();
}
function add(){
  var n=$('newName').value.trim(),t=parseInt($('newTarget').value,10);
  if(!n)return;if(!(t>0))t=33;
  S.items.push({name:n,target:t});
  $('newName').value='';$('newTarget').value='';
  save();renderList();
}

function show(v){
  $('main').classList.toggle('hidden',v!=='main');
  $('settings').classList.toggle('hidden',v!=='settings');
  if(v==='settings'){loadHap();renderList();}else{fix();render();}
}

function pat(n){var a=[];for(var i=0;i<n;i++){if(i)a.push(80);a.push(150);}return a;}
function loadHap(){$('hTick').checked=!!S.hap.tick;$('hAt').value=S.hap.alertAt;$('hN').value=S.hap.alertTicks;$('hFin').checked=!!S.hap.finish;}
function num(id,lo,hi,dflt){var v=parseInt($(id).value,10);if(isNaN(v))v=dflt;return Math.min(hi,Math.max(lo,v));}
$('hTick').onchange=function(){S.hap.tick=$('hTick').checked;save();};
$('hFin').onchange=function(){S.hap.finish=$('hFin').checked;save();};
$('hAt').onchange=function(){S.hap.alertAt=num('hAt',0,500,10);$('hAt').value=S.hap.alertAt;save();};
$('hN').onchange=function(){S.hap.alertTicks=num('hN',1,6,3);$('hN').value=S.hap.alertTicks;save();};
$('hTest').onclick=function(){buzz(pat(S.hap.alertTicks));};
$('main').addEventListener('click',tap);
function stop(id,fn){$(id).addEventListener('click',function(e){e.stopPropagation();fn();});}
stop('bSet',function(){disarm();show('settings');});
stop('bUndo',undo);
stop('bReset',reset);
$('bDone').onclick=function(){show('main');};
$('bAdd').onclick=add;
$('newName').addEventListener('keydown',function(e){if(e.key==='Enter')add();});
$('bDefaults').onclick=function(){S=defaults();S.hap=hapDef();save();loadHap();renderList();};

render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
